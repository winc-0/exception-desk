name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
        env:
          DESK_TEST_ADMIN_URL: postgresql+asyncpg://postgres:ci-only@localhost:5432/postgres

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run build

  # 用生产镜像把整条链路跑一遍：Nginx、API、迁移、RLS 角色、附件存储卷
  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-only
      DESK_APP_PASSWORD: ci-app-only
      DESK_JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      DESK_ALLOWED_ORIGINS: http://localhost:8080
      DESK_COOKIE_SECURE: "false"
      DESK_BOOTSTRAP_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml -f docker-compose.registry.yml config --quiet
        env:
          DESK_IMAGE_PREFIX: registry.example.com/ci
      - run: docker compose up -d --build
      - run: sh scripts/smoke.sh
      - if: failure()
        run: docker compose logs --no-color
